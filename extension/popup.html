<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Apollo Universal Harvester</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header with Live Apollo Tab Sync -->
    <header class="header">
      <div class="logo-box">
        <div class="pulse-indicator" id="statusIndicator"></div>
        <div>
          <h1 class="title">Apollo Harvester</h1>
          <p class="subtitle" id="statusText">Checking connection...</p>
        </div>
      </div>
      <div class="badge-tag" id="tabStatusBadge">DETACHED</div>
    </header>

    <!-- Stats Grid (Tabular Numerics) -->
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Unique Leads</span>
        <span class="stat-value" id="leadsCount">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Companies</span>
        <span class="stat-value" id="companiesCount">0</span>
      </div>
    </div>

    <!-- Quick Target Configuration -->
    <div class="section-card">
      <div class="section-header">
        <span class="section-title">Target Leads</span>
        <input type="number" id="targetLeadsInput" min="25" max="50000" step="25" value="50000" class="num-input">
      </div>

      <!-- Quick Preset Pills -->
      <div class="pill-group">
        <button class="pill-btn" data-value="500">500</button>
        <button class="pill-btn" data-value="1000">1k</button>
        <button class="pill-btn" data-value="2500">2.5k</button>
        <button class="pill-btn" data-value="5000">5k</button>
        <button class="pill-btn active" data-value="50000" id="pillAll">🌟 ALL</button>
      </div>

      <!-- Action Buttons -->
      <div class="action-buttons">
        <button id="btnStartHarvest" class="btn btn-primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          Start AI Harvest
        </button>
        <button id="btnStopHarvest" class="btn btn-danger" style="display: none;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12"></rect></svg>
          Stop & Export
        </button>
      </div>
    </div>

    <!-- Segmented Export Tray (Leads vs Audits) -->
    <div class="section-card">
      <div class="tab-segment">
        <button class="tab-btn active" id="tabBtnLeads">Data Exports</button>
        <button class="tab-btn" id="tabBtnAudits">Audit Reports</button>
      </div>

      <!-- Tab Content: Leads -->
      <div class="tab-pane active" id="tabPaneLeads">
        <div class="export-grid">
          <button id="btnExportCSV" class="btn btn-success" title="Export clean 28-column outreach CSV">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            Outreach CSV
          </button>
          <button id="btnExportCompanyCSV" class="btn btn-primary" title="Export unique organizations CSV">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            Companies CSV
          </button>
        </div>
        <div class="export-grid" style="margin-top: 6px;">
          <button id="btnExportJSON" class="btn btn-secondary" style="font-size: 11px;">
            Leads JSON
          </button>
          <button id="btnExportCompanyJSON" class="btn btn-secondary" style="font-size: 11px;">
            Companies JSON
          </button>
        </div>
      </div>

      <!-- Tab Content: Audits -->
      <div class="tab-pane" id="tabPaneAudits" style="display: none;">
        <div class="export-stack">
          <button id="btnExportPreflightPlan" class="btn btn-secondary" title="Export Preflight Density Probes & Cabinet Design Plan">
            📋 Preflight Architecture Plan CSV
          </button>
          <button id="btnExportHarvestAudit" class="btn btn-secondary" title="Export Page-by-Page Harvest Telemetry & Latencies">
            📊 Page-by-Page Harvest Audit CSV
          </button>
        </div>
      </div>
    </div>

    <!-- Database Storage & Quick Clear -->
    <div class="section-card">
      <div class="preview-header">
        <span class="section-title" style="margin-bottom: 0;">IndexedDB Storage</span>
        <button id="btnClear" class="btn-text">Clear DB</button>
      </div>
      <div class="preview-container" id="previewContainer">
        <div class="empty-state">No leads in storage. Open Apollo to start!</div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span>Apollo Universal Harvester • Pure Client-Side MV3</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
